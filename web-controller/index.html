<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>远程控制 - 控制端</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 连接界面 -->
    <div id="connect-screen" class="screen active">
        <div class="connect-container">
            <h1>远程控制</h1>
            <p class="subtitle">输入配对码连接到设备</p>
            <div class="input-group">
                <label for="server-url">服务器地址</label>
                <input type="text" id="server-url" placeholder="wss://服务器地址:3000">
            </div>
            <div class="input-group">
                <label for="pairing-code">配对码（6位数字）</label>
                <input type="text" id="pairing-code" placeholder="123456" maxlength="6" inputmode="numeric">
            </div>
            <button id="connect-btn" class="btn-primary">连接设备</button>
            <div id="connect-status" class="status-text"></div>
        </div>
    </div>

    <!-- 控制界面 -->
    <div id="control-screen" class="screen">
        <div id="status-bar">
            <div id="device-info">未连接</div>
            <div id="fps-counter">FPS: --</div>
        </div>
        <div id="canvas-container">
            <canvas id="screen-canvas"></canvas>
            <div id="loading-overlay">等待画面传输...</div>
        </div>
        <div id="control-bar">
            <button id="btn-back" class="btn-control" title="返回">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                返回
            </button>
            <button id="btn-home" class="btn-control" title="主页">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                主页
            </button>
            <button id="btn-recents" class="btn-control" title="最近任务">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                任务
            </button>
            <button id="btn-disconnect" class="btn-control btn-danger" title="断开连接">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M7 11v2h10v-2H7zm5-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                断开
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
